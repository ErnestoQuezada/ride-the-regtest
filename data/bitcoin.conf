# Regtest-only classroom node. Never reuse these credentials elsewhere.
regtest=1
server=1
txindex=1

# Regtest has no useful public peers; only Apache is exposed to the LAN.
listen=0

fallbackfee=0.0001

rpcuser=user
rpcpassword=password

# Allow connections from Localhost (for the panel) and Tailscale (for classmates)
[regtest]
rpcbind=0.0.0.0
rpcallowip=127.0.0.1
rpcallowip=100.64.0.0/1

zmqpubrawblock=tcp://127.0.0.1:28332
zmqpubrawtx=tcp://127.0.0.1:28333